{% extends "base.html" %}
{% block title %}Report Detail - Report Generator{% endblock %}

{% block content %}
<!-- Breadcrumb -->
<nav class="flex items-center gap-2 text-sm text-gray-500 mb-6">
    <a href="/" class="hover:text-gray-700">Dashboard</a>
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
    <span class="text-gray-900 font-medium">Report {{ report_id[:12] }}...</span>
</nav>

<!-- Header -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-900">Report</h1>
        <p class="mt-1 text-sm text-gray-500 font-mono">{{ report_id }}</p>
    </div>
    <div class="flex gap-2">
        <button onclick="batchGenerate('narrative')"
            class="inline-flex items-center gap-1.5 rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700 transition">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" /></svg>
            Generate All Pages
        </button>
        <button onclick="batchGenerate('json')"
            class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" /></svg>
            Generate All JSON
        </button>
    </div>
</div>

<!-- Pages grid -->
<div id="report-pages" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="col-span-full text-center text-sm text-gray-400 py-12">Loading report pages...</div>
</div>

<!-- Settings modal -->
<div id="batch-modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
    <div class="flex min-h-screen items-center justify-center p-4">
        <div class="fixed inset-0 bg-black/30 backdrop-blur-sm" onclick="closeBatchModal()"></div>
        <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md p-6 fade-in">
            <h3 class="text-lg font-semibold text-gray-900 mb-4" id="batch-title">Batch Generate</h3>
            <form onsubmit="submitBatch(event)">
                <input type="hidden" id="batch-type">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Analysis Level</label>
                        <select id="batch-level" class="w-full rounded-lg border border-gray-300 py-2 px-3 text-sm">
                            <option value="COST_EFFECTIVE">Cost Effective</option>
                            <option value="OPTIMAL" selected>Optimal</option>
                            <option value="TOP_GRADE">Top Grade</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Model Variant</label>
                        <select id="batch-variant" class="w-full rounded-lg border border-gray-300 py-2 px-3 text-sm">
                            <option value="A" selected>Variant A</option>
                            <option value="B">Variant B</option>
                            <option value="C">Variant C</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" onclick="closeBatchModal()" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</button>
                    <button type="submit" class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700 transition">Start Batch</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const REPORT_ID = '{{ report_id }}';

async function loadReportPages() {
    try {
        const pages = await api.getReportPages(REPORT_ID);
        renderReportPages(pages);
    } catch (err) {
        document.getElementById('report-pages').innerHTML =
            `<div class="col-span-full text-center text-sm text-red-500 py-12">Failed to load: ${err.message}</div>`;
    }
}

function renderReportPages(pages) {
    const container = document.getElementById('report-pages');
    if (!pages.length) {
        container.innerHTML = '<div class="col-span-full text-center text-sm text-gray-400 py-12">No pages found for this report.</div>';
        return;
    }

    container.innerHTML = pages.map(page => `
        <a href="/pages/${page.id}" class="block bg-white rounded-xl border border-gray-200 p-4 hover:border-brand-300 hover:shadow-sm transition">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-gray-900 truncate">${truncate(page.id, 12)}</span>
                ${statusBadge(page.generation_status)}
            </div>
            <div class="flex items-center justify-between text-xs text-gray-400">
                <span>Order: ${page.page_order ?? '-'}</span>
                ${page.overall != null ? `<span class="font-medium ${page.overall >= 80 ? 'text-green-600' : page.overall >= 60 ? 'text-yellow-600' : 'text-red-600'}">${page.overall.toFixed(1)}</span>` : '<span>-</span>'}
            </div>
        </a>
    `).join('');
}

function batchGenerate(type) {
    document.getElementById('batch-type').value = type;
    document.getElementById('batch-title').textContent =
        type === 'json' ? 'Batch Generate JSON' : 'Batch Generate Narratives';
    document.getElementById('batch-modal').classList.remove('hidden');
}

function closeBatchModal() {
    document.getElementById('batch-modal').classList.add('hidden');
}

async function submitBatch(e) {
    e.preventDefault();
    const type = document.getElementById('batch-type').value;
    const level = document.getElementById('batch-level').value;
    const variant = document.getElementById('batch-variant').value;

    try {
        let result;
        if (type === 'json') {
            result = await api.batchGenerateJson(REPORT_ID, { analysis_level: level, model_variant: variant });
        } else {
            result = await api.batchGeneratePages(REPORT_ID, { analysis_level: level, model_variant: variant });
        }
        showToast(`Batch started: ${result.queued_page_count} pages queued`, 'success');
        closeBatchModal();
        setTimeout(loadReportPages, 1000);
    } catch (err) {
        showToast('Failed: ' + err.message, 'error');
    }
}

loadReportPages();
setInterval(loadReportPages, 10000);
</script>
{% endblock %}
